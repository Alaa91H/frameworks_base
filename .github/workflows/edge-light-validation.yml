name: Edge light validation

on:
  pull_request:
    branches:
      - cnb
    paths:
      - "core/java/android/provider/Settings.java"
      - "packages/SystemUI/src/com/android/systemui/edgelight/**"
      - "tools/validate_edge_light.py"
      - ".github/workflows/edge-light-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Edge light integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            core/java/android/provider/Settings.java
            packages/SystemUI/src/com/android/systemui/edgelight
            tools/validate_edge_light.py

      - name: Validate Python checker
        run: python3 -m py_compile tools/validate_edge_light.py

      - name: Validate edge light contract
        run: python3 tools/validate_edge_light.py

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
