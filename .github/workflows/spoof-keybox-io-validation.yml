name: Spoof keybox network I/O validation

on:
  pull_request:
    branches:
      - cnb
    paths:
      - "services/core/java/com/android/server/spoof/AxSpoofManager.java"
      - "tools/validate_spoof_keybox_io.py"
      - ".github/workflows/spoof-keybox-io-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Keybox network I/O invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate checker syntax
        run: python3 -m py_compile tools/validate_spoof_keybox_io.py

      - name: Validate keybox I/O
        run: python3 tools/validate_spoof_keybox_io.py

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
